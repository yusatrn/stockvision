spring:
  application:
    name: stockvision-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: StockVision AI Backend
    version: "@project.version@"

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Trace-Id
    exposed-headers:
      - X-Trace-Id
    allow-credentials: true
    max-age-seconds: 3600
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:stockvision-api}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      max-tracked-keys: 10000
  marketdata:
    provider: ${MARKET_DATA_PROVIDER:mock}
    stale-threshold-hours: ${MARKET_DATA_STALE_THRESHOLD_HOURS:24}
    default-lookback-days: ${MARKET_DATA_DEFAULT_LOOKBACK_DAYS:90}
    yahoo:
      base-url: ${MARKET_DATA_YAHOO_BASE_URL:https://query1.finance.yahoo.com}
      symbol-suffix: ${MARKET_DATA_YAHOO_SYMBOL_SUFFIX:.IS}
      timeout-ms: ${MARKET_DATA_YAHOO_TIMEOUT_MS:10000}
      quote-cache-seconds: ${MARKET_DATA_YAHOO_QUOTE_CACHE_SECONDS:60}
  scoring:
    max-data-age-hours: ${SCORING_MAX_DATA_AGE_HOURS:120}
    reject-stale-data: ${SCORING_REJECT_STALE_DATA:true}
    weights:
      trend: 20
      rsi: 15
      macd: 15
      volume: 15
      bollinger: 10
      momentum: 10
      support-resistance: 15
  alerts:
    scheduler:
      enabled: ${ALERTS_SCHEDULER_ENABLED:true}
      fixed-delay-ms: ${ALERTS_SCHEDULER_FIXED_DELAY_MS:60000}
    reject-stale-data: ${ALERTS_REJECT_STALE_DATA:true}
    default-cooldown-minutes: ${ALERTS_DEFAULT_COOLDOWN_MINUTES:60}
  ai:
    provider: ${AI_PROVIDER:template}
    timeout-ms: ${AI_TIMEOUT_MS:15000}
    ollama:
      base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${AI_OLLAMA_MODEL:llama3.2:3b}
    gemini-free:
      base-url: ${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      model: ${AI_GEMINI_MODEL:gemini-2.0-flash-lite}
      api-key: ${AI_GEMINI_API_KEY:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z',UTC} %-5level [%thread] [traceId=%X{traceId:-none}] %logger{36} - %msg%n"
